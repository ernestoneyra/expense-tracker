# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint, pick this repo, then paste your Atlas connection string for MONGODB_URI.
services:
  - type: web
    name: expenser
    runtime: node
    plan: free
    # The build needs devDependencies (TypeScript, Vite), which Render skips when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: true
      # Render puts one proxy in front of the app: needed for the real visitor address and https.
      - key: TRUST_PROXY
        value: 1
      # Your service's public address, e.g. https://expenser.onrender.com (shown on the service page).
      # Only needed for Google / GitHub sign-in; add GOOGLE_* / GITHUB_* the same way to turn those on.
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: expenser-demo
