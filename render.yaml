# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint, pick this repo, then paste your Atlas connection string for MONGODB_URI.
services:
  - type: web
    name: expenser
    runtime: node
    plan: free
    # The build needs devDependencies (TypeScript, Vite), which Render skips when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: expenser-demo
